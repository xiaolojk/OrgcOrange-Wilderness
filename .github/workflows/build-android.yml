name: 编译 Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Godot 导出 Android
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: 缓存 Godot
        uses: actions/cache@v4
        with:
          path: |
            /tmp/godot
            ~/.local/share/godot/export_templates
          key: godot-4.3-stable-android-v2

      - name: 安装 Godot + 导出模板
        run: |
          set -e
          GODOT_VERSION="4.3-stable"
          mkdir -p /tmp/godot
          if [ ! -f /tmp/godot/godot ]; then
            wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -O /tmp/godot/godot.zip
            unzip -o /tmp/godot/godot.zip -d /tmp/godot
            mv /tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64 /tmp/godot/godot
            chmod +x /tmp/godot/godot
          fi
          TPL_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$TPL_DIR"
          if [ ! -f "$TPL_DIR/android_release.apk" ]; then
            wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz" -O /tmp/godot/tpl.tpz
            unzip -o /tmp/godot/tpl.tpz -d /tmp/godot/tpl
            cp /tmp/godot/tpl/templates/android_debug.apk "$TPL_DIR/"
            cp /tmp/godot/tpl/templates/android_release.apk "$TPL_DIR/"
          fi
          /tmp/godot/godot --version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: 生成 debug keystore
        run: |
          mkdir -p ~/.local/share/godot/keystores
          if [ ! -f ~/.local/share/godot/keystores/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.local/share/godot/keystores/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=OrgcOrange, OU=Orgc, O=Orgc橘子工作室, L=CN, ST=CN, C=CN"
          fi
          ls -lh ~/.local/share/godot/keystores/debug.keystore

      - name: 配置 Godot editor settings
        run: |
          mkdir -p ~/.config/godot
          # 先让 Godot 生成默认 settings
          /tmp/godot/godot --headless --editor --quit >/dev/null 2>&1 || true
          SETTINGS=~/.config/godot/editor_settings-4.3.tres
          if [ ! -f "$SETTINGS" ]; then
            SETTINGS=~/.config/godot/editor_settings-4.tres
          fi
          echo "=== 修改前 ==="
          grep -E "android_sdk_path|java_sdk_path|debug_keystore " "$SETTINGS" || true
          # 替换 SDK / JDK / keystore 路径
          sed -i "s|export/android/android_sdk_path = .*|export/android/android_sdk_path = \"$ANDROID_HOME\"|" "$SETTINGS"
          sed -i "s|export/android/java_sdk_path = .*|export/android/java_sdk_path = \"$JAVA_HOME\"|" "$SETTINGS"
          sed -i "s|export/android/debug_keystore = .*|export/android/debug_keystore = \"$HOME/.local/share/godot/keystores/debug.keystore\"|" "$SETTINGS"
          echo "=== 修改后 ==="
          grep -E "android_sdk_path|java_sdk_path|debug_keystore " "$SETTINGS"

      - name: 导入项目资源（生成 ETC2/ASTC 纹理）
        run: |
          /tmp/godot/godot --headless --editor --quit 2>&1 | tail -3 || true

      - name: 导出 APK
        run: |
          set -e
          mkdir -p build
          /tmp/godot/godot --headless --export-release "Android" build/OrangeWilderness.apk
          ls -lh build/

      - name: 上传 APK 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: OrangeWilderness-APK
          path: build/OrangeWilderness.apk
          if-no-files-found: error

  release:
    name: 发布到 GitHub Releases
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载 APK 产物
        uses: actions/download-artifact@v4
        with:
          name: OrangeWilderness-APK
          path: release

      - name: 创建 Release 并上传 APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" release/OrangeWilderness.apk \
            --repo "$REPO" \
            --title "《橘子荒野》$TAG" \
            --notes "Orgc橘子工作室 出品 · 像素风荒野生存开放世界

          Android 10+ 通用（arm64/armv7，适配 vivo 全系）。

          安装：下载 OrangeWilderness.apk，在手机上允许\"未知来源\"后安装。" \
            --verify-tag
